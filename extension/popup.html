<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Recap</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-box">
      <p class="popup-title">Video Recap</p>
      <p id="status-text" class="status-text">Checking video...</p>

      <button id="recap-button" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M1 4v6h6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
          <path
            d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
        <span id="recap-button-text">Recap</span>
      </button>

      <label class="voiceover-row" for="voiceover-checkbox">
        <input type="checkbox" id="voiceover-checkbox" />
        <span>Voiceover</span>
      </label>

      <p id="error-text" class="error-text"></p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
